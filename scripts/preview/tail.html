<script>(function(){
var KEY='morning-brief:vocab';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return window.__vocab||[]}}
function save(v){window.__vocab=v;try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function strip(){var v=load();document.querySelectorAll('button[data-term]').forEach(function(b){if(v.some(function(x){return x.word===b.dataset.term})){b.replaceWith(document.createTextNode(b.textContent))}})}
var sheet=null;
function close(){if(sheet){sheet.remove();sheet=null}}
function open(b){close();var t={word:b.dataset.term,meaning:b.dataset.meaning,articleTitle:b.dataset.title,url:b.dataset.url};
 sheet=document.createElement('div');sheet.className='fixed inset-0 z-50 flex items-end justify-center sm:items-center';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');
 sheet.innerHTML='<button type="button" aria-label="閉じる" class="absolute inset-0 bg-black/40" data-x></button><div class="relative w-full max-w-md rounded-t-2xl bg-surface p-6 shadow-2xl sm:rounded-2xl" style="padding-bottom:max(1.5rem,env(safe-area-inset-bottom))"><p class="text-xs font-bold text-muted">言葉の意味</p><h2 class="mt-1 text-2xl font-black">'+esc(t.word)+'</h2><p class="mt-3 text-[15px] leading-7">'+esc(t.meaning)+'</p><div class="mt-6 flex gap-3"><button type="button" data-learn class="flex-1 rounded-xl bg-band px-4 py-3 text-sm font-bold text-band-ink hover:opacity-90">覚えた（単語帳に追加）</button><button type="button" data-x class="rounded-xl border border-line px-4 py-3 text-sm font-bold text-muted hover:text-ink">閉じる</button></div><p class="mt-4 text-xs text-faint">覚えた言葉は記事の中でタップできなくなります。<a href="#words" class="ml-1 underline underline-offset-2" data-x>単語帳を見る</a></p></div>';
 document.body.appendChild(sheet);
 sheet.querySelectorAll('[data-x]').forEach(function(x){x.addEventListener('click',close)});
 var l=sheet.querySelector('[data-learn]');l.focus();l.addEventListener('click',function(){var v=load();if(!v.some(function(x){return x.word===t.word})){t.learnedAt=new Date().toISOString();v.unshift(t);save(v)}close();strip();renderWords()});
}
document.addEventListener('click',function(e){var b=e.target.closest('button[data-term]');if(b)open(b)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
// AIに質問
function link(form,q){var url='https://claude.ai/new?q='+encodeURIComponent(form.dataset.ask+'\n\n質問：'+q);var a=form.querySelector('[data-open]');if(!a){a=document.createElement('a');a.setAttribute('data-open','');a.target='_blank';a.rel='noopener noreferrer';a.className='mt-2 inline-block rounded-lg bg-signal px-3 py-1.5 text-xs font-bold text-band';form.appendChild(a)}a.href=url;a.textContent='「'+(q.length>18?q.slice(0,18)+'…':q)+'」をClaudeで開く';}
document.querySelectorAll('form[data-ask]').forEach(function(f){var i=f.querySelector('input'),s=f.querySelector('button[type=submit]');
 i.addEventListener('input',function(){s.disabled=!i.value.trim()});
 f.addEventListener('submit',function(e){e.preventDefault();if(i.value.trim())link(f,i.value.trim())});
 f.querySelectorAll('button[type=button]').forEach(function(p){p.addEventListener('click',function(){link(f,p.textContent)})});});
// 単語帳（#words）
var words=document.createElement('section');words.id='words';words.hidden=true;words.style.cssText='position:fixed;inset:0;z-index:25;overflow-y:auto;background:var(--paper)';document.body.appendChild(words);
function renderWords(){var v=load();var h='<header class="bg-band text-band-ink"><div class="mx-auto flex max-w-6xl items-end justify-between gap-4 px-4 pt-5 pb-4 sm:px-6"><span class="text-lg font-black tracking-tight sm:text-2xl">Morning Brief</span><a href="#" class="hidden lg:block rounded-lg bg-band-ink/10 px-3 py-1.5 text-xs font-bold">今日のニュースへ</a></div></header><main class="mx-auto max-w-6xl px-4 pt-6 pb-28 sm:px-6"><h1 class="text-2xl font-black sm:text-3xl">単語帳</h1><p class="mt-2 text-sm text-muted">記事で覚えた言葉の一覧です。新しく覚えた順に並んでいます。</p>';
 if(!v.length){h+='<div class="mt-10 rounded-2xl bg-surface p-8 text-center"><p class="text-lg font-black">まだ単語がありません</p><p class="mt-2 text-sm leading-7 text-muted">記事の中で点線が引かれた言葉をタップし、「覚えた」を押すとここに追加されます。</p></div>'}
 else{h+='<p class="mt-6 text-sm text-muted">'+v.length+'語</p><ul class="mt-4 grid gap-3 sm:grid-cols-2">'+v.map(function(x){return '<li class="flex flex-col rounded-2xl bg-surface p-5"><h2 class="text-lg font-black">'+esc(x.word)+'</h2><p class="mt-2 text-[15px] leading-7">'+esc(x.meaning)+'</p><div class="mt-auto flex items-end justify-between gap-3 pt-4"><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer" class="min-w-0 truncate text-xs text-faint">'+esc(x.articleTitle)+'</a><button type="button" data-forget="'+esc(x.word)+'" class="shrink-0 rounded-lg border border-line px-2.5 py-1 text-xs text-muted">単語帳から外す</button></div></li>'}).join('')+'</ul>'}
 h+='<p class="mt-8 text-xs leading-6 text-faint">単語帳はこの端末のブラウザに保存されます。外した言葉は、記事の中で再びタップできるようになります（このプレビューでは再読み込み後）。</p></main>';words.innerHTML=h;
 words.querySelectorAll('[data-forget]').forEach(function(b){b.addEventListener('click',function(){save(load().filter(function(x){return x.word!==b.dataset.forget}));renderWords()})});}
var arc=document.createElement('section');arc.hidden=true;arc.style.cssText=words.style.cssText;document.body.appendChild(arc);
arc.innerHTML='<header class="bg-band text-band-ink"><div class="mx-auto max-w-3xl px-4 pt-3 pb-3"><span class="text-lg font-black tracking-tight">Morning Brief</span></div></header><main class="mx-auto max-w-3xl px-4 pt-6 pb-28"><h1 class="text-2xl font-black">過去のまとめ</h1><ul class="mt-5 space-y-3"><li><a href="#" class="block rounded-3xl bg-surface p-5"><div class="flex items-baseline justify-between gap-3"><p class="font-black">2026年11月5日（木）</p><p class="shrink-0 text-xs text-faint">今日・36本</p></div><p class="mt-2 text-[14px] leading-6 text-muted">'+(document.querySelector('section ul li span:last-child')||{textContent:''}).textContent+'</p></a></li></ul><p class="mt-6 text-xs text-faint">毎朝のまとめがここに日付順にたまっていきます。</p></main>';
function setTab(id){document.querySelectorAll('nav[aria-label="メニュー"] a').forEach(function(a){var on=a.getAttribute('href')===id;a.classList.toggle('text-ink',on);a.classList.toggle('text-faint',!on);var dot=a.querySelector('.bg-signal');if(dot)dot.style.display=on?'':'none';if(on&&!dot){var d=document.createElement('span');d.className='absolute -top-1.5 left-1/2 h-1 w-4 -translate-x-1/2 rounded-full bg-signal';a.querySelector('span').appendChild(d)}})}
function route(){var h=location.hash;words.hidden=h!=='#words';arc.hidden=h!=='#archive-list';if(!words.hidden){renderWords();words.scrollTop=0}if(!arc.hidden)arc.scrollTop=0;setTab(h==='#words'?'#words':h==='#archive-list'?'#archive-list':'#')}
window.addEventListener('hashchange',route);
document.querySelectorAll('a[href="/words"]').forEach(function(a){a.setAttribute('href','#words')});document.querySelectorAll('a[href="/archive"]').forEach(function(a){a.setAttribute('href','#archive-list')});
strip();route();
})();
</script>
