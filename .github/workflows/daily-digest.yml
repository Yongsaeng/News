name: 毎朝のニュースまとめ

on:
  schedule:
    # 毎日 22:00 UTC = 日本時間 7:00（GitHub の混雑で数分〜十数分遅れることがあります）
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ニュースを収集して要約
        run: npm run fetch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/digests
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "digest: $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
