name: 試し収集（作業ブランチ用・一時）
on:
  push:
    branches: [claude/project-thread-ynl0t4]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
      - name: 作業ブランチにコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/raw
          git commit -m "collect: $(TZ=Asia/Tokyo date +%F)（新しいソースで収集し直し）" || exit 0
          git push
