name: プレビュー用画像の取得（一時）
on:
  push:
    branches: [preview-assets]
    paths: [".github/workflows/preview-assets.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p preview
          i=0
          for u in $(python3 -c "import json;d=json.load(open('data/digests/2026-11-05.json'));print('\n'.join(x['image'] for c in d['categories'] for x in c['items'] if x.get('image')))"); do
            i=$((i+1)); curl -sL --max-time 20 -A 'Mozilla/5.0' -o "preview/$i.img" "$u" || true
            echo "$i $u" >> preview/index.txt
          done
          ls -la preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview && git commit -m "preview images" && git push
